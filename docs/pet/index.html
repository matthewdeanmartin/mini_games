<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pets Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: #222;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 500px;
            height: 500px;
            background-color: #000;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background-size: cover;
            background-position: center;
        }

        .active {
            display: block;
        }

        /* UI Overlays */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            box-sizing: border-box;
            font-size: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }

        .stat {
            margin-bottom: 5px;
        }

        /* Pet & Backgrounds */
        .bg-main {
            background-image: url('Main room.png');
        }

        .bg-kitchen {
            background-image: url('Kitchen.png');
        }

        .bg-play {
            background-image: url('Play room.png');
        }

        .bg-sleep {
            background-image: url('Sleep room.png');
        }

        .bg-color {
            background-color: #3b5266;
        }

        #pet-container {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 5;
        }

        #pet-image {
            max-width: 150px;
            image-rendering: pixelated;
        }

        #speech-bubble {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: black;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 10px;
            white-space: nowrap;
            display: none;
            z-index: 10;
        }

        /* Navigation Buttons */
        .nav-btn {
            position: absolute;
            width: 50px;
            height: 50px;
            cursor: pointer;
            z-index: 10;
            background-size: cover;
            border: 2px solid transparent;
            image-rendering: pixelated;
        }

        .nav-btn:hover {
            border-color: white;
        }

        #btn-kitchen {
            top: 80px;
            left: 10px;
            background-image: url('Food button.png');
        }

        #btn-play {
            top: 140px;
            left: 10px;
            background-image: url('Play room button.png');
        }

        #btn-sleep {
            top: 200px;
            left: 10px;
            background-image: url('Sleep button.png');
        }

        #btn-main {
            top: 260px;
            left: 10px;
            background-color: #888;
            color: white;
            font-size: 8px;
            text-align: center;
            line-height: 50px;
        }

        #btn-stats {
            top: 320px;
            left: 10px;
            background-color: #44a;
            color: white;
            font-size: 8px;
            text-align: center;
            line-height: 50px;
        }

        /* In-Room Actions */
        .action-panel {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        button {
            font-family: 'Press Start 2P', monospace;
            background: #fff;
            color: #000;
            border: 2px solid #000;
            padding: 10px;
            cursor: pointer;
            font-size: 10px;
            margin: 5px;
        }

        button:hover {
            background: #ddd;
        }

        /* Pause & Overlays */
        #pause-btn {
            position: absolute;
            top: 10px;
            right: 220px;
            z-index: 15;
            background: red;
            color: white;
        }

        #overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            text-align: center;
            z-index: 20;
            display: none;
            width: 80%;
        }

        /* Selection Screen */
        .pet-choice {
            display: inline-block;
            margin: 10px;
            cursor: pointer;
            text-align: center;
        }

        .pet-choice img {
            width: 60px;
            image-rendering: pixelated;
        }

        .pet-choice:hover {
            transform: scale(1.1);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="top-bar" class="hidden">
        <div>
            <div class="stat">Coins: <span id="ui-coins">30</span></div>
            <div class="stat">Age: <span id="ui-age">0</span> m</div>
        </div>
        <div>
            <div class="stat">Hunger: <span id="ui-hunger">80</span>%</div>
            <div class="stat">Sleep: <span id="ui-sleep">85</span>%</div>
            <div class="stat">Happy: <span id="ui-happy">50</span>%</div>
        </div>
    </div>

    <div id="nav-ui" class="hidden">
        <div id="btn-kitchen" class="nav-btn" onclick="goToRoom('kitchen')" title="Kitchen"></div>
        <div id="btn-play" class="nav-btn" onclick="goToRoom('play')" title="Play Room"></div>
        <div id="btn-sleep" class="nav-btn" onclick="goToRoom('sleep')" title="Sleep Room"></div>
        <div id="btn-main" class="nav-btn" onclick="goToRoom('main')">MAIN</div>
        <div id="btn-stats" class="nav-btn" onclick="goToRoom('stats')">STATS</div>
        <button id="pause-btn" onclick="togglePause()">II</button>
    </div>

    <div id="pet-container" class="hidden">
        <div id="speech-bubble"></div>
        <img id="pet-image" src="" alt="Pet">
    </div>

    <div id="screen-select" class="screen bg-color active">
        <h2 style="text-align:center; margin-top: 20px;">Choose a Pet</h2>
        <div style="text-align:center; margin-top: 30px;" id="pet-selection-list">
        </div>
        <p style="text-align:center; font-size:10px; margin-top:20px;">Eggs owned: <span id="ui-eggs">0</span></p>
    </div>

    <div id="screen-main" class="screen bg-main"></div>

    <div id="screen-kitchen" class="screen bg-kitchen">
        <div class="action-panel">
            <button onclick="buyFood(5, 10)">Snack (5 Coins)</button>
            <button onclick="buyFood(10, 25)">Meal (10 Coins)</button>
        </div>
    </div>

    <div id="screen-play" class="screen bg-play">
        <div class="action-panel">
            <button onclick="playWithPet()">Throw Toy</button>
        </div>
    </div>

    <div id="screen-sleep" class="screen bg-sleep">
        <div class="action-panel">
            <button id="sleep-action-btn" onclick="toggleSleeping()">Go to Sleep</button>
        </div>
    </div>

    <div id="screen-stats" class="screen bg-color">
        <div style="padding: 60px 90px; line-height: 2;">
            <h3>Pet Stats</h3>
            <p>Gender: <span id="stat-gender"></span></p>
            <p>Happiness: <span id="stat-happy"></span>%</p>
            <p>Age: <span id="stat-age"></span> minutes</p>
            <p>Other Pets (Eggs): <span id="stat-eggs"></span></p>
            <hr>
            <h3>Shop</h3>
            <button onclick="buyToy()">Upgrade Toy (<span id="shop-toy-cost">20</span> coins)</button>
        </div>
    </div>

    <div id="overlay-text">
        <h3 id="overlay-title"></h3>
        <p id="overlay-msg"></p>
        <button onclick="closeOverlay()">OK</button>
    </div>
</div>

<script>
    // --- Configuration & Data ---
    const petsData = [
        {id: 'snake', name: 'Snake', img: 'Snake.png'},
        {id: 'dog', name: 'Dog', img: 'Dog.png'},
        {id: 'cat', name: 'Cat', img: 'Cat.png'},
        {id: 'spider', name: 'Spider', img: 'Spiter .png'},
        {id: 'bird', name: 'Bird', img: 'Bird.png'},
        {id: 'fish', name: 'Fish', img: 'Fish.png'}
    ];

    // --- Game State ---
    let currentPet = null;
    let isPaused = false;
    let isSleeping = false;

    let coins = 30;
    let hunger = 80;
    let sleep = 85;
    let happy = 50;

    let age = 0; // in minutes
    let gender = "";
    let eggsOwned = 0;
    let toyLevel = 1;
    let toyCost = 20;

    let secondsPlayed = 0;
    let gameLoop;
    let sleepTimer = 0;
    let currentRoom = 'main';

    // --- Initialization ---
    window.onload = () => {
        const selectList = document.getElementById('pet-selection-list');
        petsData.forEach(pet => {
            selectList.innerHTML += `
                <div class="pet-choice" onclick="startGame('${pet.id}')">
                    <img src="${pet.img}" alt="${pet.name}"><br>
                    <span style="font-size:8px;">${pet.name}</span>
                </div>
            `;
        });
        document.getElementById('ui-eggs').innerText = eggsOwned;
    };

    function startGame(petId) {
        currentPet = petsData.find(p => p.id === petId);

        // Reset Stats
        coins = 30;
        hunger = 80;
        sleep = 85;
        happy = 50;
        age = 0;
        secondsPlayed = 0;
        isSleeping = false;
        toyLevel = 1;
        toyCost = 20;
        gender = Math.random() > 0.5 ? "Boy" : "Girl";

        // Setup UI
        document.getElementById('pet-image').src = currentPet.img;
        document.getElementById('stat-gender').innerText = gender;

        showScreen('main');
        document.getElementById('top-bar').classList.remove('hidden');
        document.getElementById('nav-ui').classList.remove('hidden');
        document.getElementById('pet-container').classList.remove('hidden');

        updateUI();

        if (gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(tick, 1000);
    }

    // --- Core Game Loop ---
    function tick() {
        if (isPaused) return;

        secondsPlayed++;

        // Age increases every 60 seconds
        if (secondsPlayed % 60 === 0) age++;

        // Hunger goes down every minute (60s)
        if (secondsPlayed % 60 === 0) hunger--;

        // Sleep logic
        if (isSleeping) {
            sleepTimer++;
            if (sleepTimer >= 30) {
                sleep++;
                sleepTimer = 0;
            }
        } else {
            // Sleep percentage goes down every two minutes (120s)
            if (secondsPlayed % 120 === 0) sleep--;
        }

        capStats();
        updateUI();
        checkPetEffects();
        checkGameOver();
    }

    function capStats() {
        if (hunger > 100) hunger = 100;
        if (sleep > 100) sleep = 100;
        if (happy > 100) happy = 100;
        if (hunger < 0) hunger = 0;
        if (sleep < 0) sleep = 0;
        if (happy < 0) happy = 0;
    }

    // --- Actions & Buttons ---
    function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById('pause-btn');
        if (isPaused) {
            btn.innerText = "►";
            btn.style.background = "green";
            // Pause Penalty: Everything goes down by 3%
            hunger -= 3;
            sleep -= 3;
            happy -= 3;
            capStats();
            updateUI();
            checkGameOver();
            showOverlay("Paused", "-3% to all stats for pausing!");
        } else {
            btn.innerText = "II";
            btn.style.background = "red";
            document.getElementById('overlay-text').style.display = 'none';
        }
    }

    function buyFood(cost, restoreAmt) {
        if (isPaused || isSleeping) return;
        if (coins >= cost) {
            coins -= cost;
            hunger += restoreAmt;
            capStats();
            updateUI();
            showSpeech("Yum!");
        } else {
            showSpeech("Need coins!");
        }
    }

    function playWithPet() {
        if (isPaused || isSleeping) return;

        // Playing decreases sleep by 2%
        sleep -= 2;
        happy += 5;

        // Earn coins based on toy level
        let coinsEarned = 2 + (toyLevel * 2);
        coins += coinsEarned;

        capStats();
        updateUI();
        showSpeech(`+${coinsEarned} Coins!`);
        checkGameOver();
    }

    function toggleSleeping() {
        if (isPaused) return;
        isSleeping = !isSleeping;
        const btn = document.getElementById('sleep-action-btn');
        if (isSleeping) {
            btn.innerText = "Wake Up";
            showSpeech("Zzz...");
        } else {
            btn.innerText = "Go to Sleep";
            sleepTimer = 0;
            showSpeech("I'm awake!");
        }
    }

    function buyToy() {
        if (coins >= toyCost) {
            coins -= toyCost;
            toyLevel++;
            toyCost = Math.floor(toyCost * 1.5);
            document.getElementById('shop-toy-cost').innerText = toyCost;
            updateUI();
            showSpeech("Yay! Better toys!");
        } else {
            showSpeech("Not enough coins!");
        }
    }

    // --- Navigation ---
    function goToRoom(roomName) {
        if (isPaused) return;
        if (isSleeping && roomName !== 'sleep') toggleSleeping(); // Wake up if leaving room
        showScreen(roomName);
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-' + screenId).classList.add('active');
        currentRoom = screenId;
        updateUI();
    }

    // --- Pet Specific Behaviors ---
    function checkPetEffects() {
        if (isSleeping) return;

        let sound = "";
        let doSpecial = false;

        switch (currentPet.id) {
            case 'cat':
                if (secondsPlayed % 60 === 0) sound = "meow";
                if (hunger === 65) {
                    sound = "MEOW";
                    doSpecial = true;
                }
                break;
            case 'dog':
                if (secondsPlayed % 50 === 0) sound = "bark";
                if (happy === 70) {
                    sound = "WooF!";
                    doSpecial = true;
                }
                break;
            case 'snake':
                if (secondsPlayed % 70 === 0) sound = "hiss";
                if (sleep === 65) {
                    sound = "HIISS";
                    doSpecial = true;
                }
                break;
            case 'bird':
                if (secondsPlayed % 30 === 0) sound = "tweet tweet";
                if (hunger === 75 || sleep === 75 || happy === 75) {
                    sound = "chirp! chirp! chirp! chirp! chirp!";
                    doSpecial = true;
                }
                break;
        }

        if (sound !== "") {
            showSpeech(sound, doSpecial ? 3000 : 1500);
        }
    }

    // --- UI & Helpers ---
    function updateUI() {
        document.getElementById('ui-coins').innerText = coins;
        document.getElementById('ui-hunger').innerText = hunger;
        document.getElementById('ui-sleep').innerText = Math.floor(sleep);
        document.getElementById('ui-happy').innerText = happy;
        document.getElementById('ui-age').innerText = age;

        // Stats page updates
        document.getElementById('stat-happy').innerText = happy;
        document.getElementById('stat-age').innerText = age;
        document.getElementById('stat-eggs').innerText = eggsOwned;
    }

    function showSpeech(text, duration = 2000) {
        const bubble = document.getElementById('speech-bubble');
        bubble.innerText = text;
        bubble.style.display = 'block';
        setTimeout(() => {
            if (bubble.innerText === text) bubble.style.display = 'none';
        }, duration);
    }

    function showOverlay(title, msg) {
        document.getElementById('overlay-title').innerText = title;
        document.getElementById('overlay-msg').innerText = msg;
        document.getElementById('overlay-text').style.display = 'block';
    }

    function closeOverlay() {
        document.getElementById('overlay-text').style.display = 'none';
    }

    // --- Game Over Logic ---
    function checkGameOver() {
        if (hunger <= 10 || sleep <= 10) {
            clearInterval(gameLoop);
            showSpeech("Goodbye!");

            setTimeout(() => {
                eggsOwned++;
                document.getElementById('ui-eggs').innerText = eggsOwned;

                // Hide game UI, show selection
                document.getElementById('top-bar').classList.add('hidden');
                document.getElementById('nav-ui').classList.add('hidden');
                document.getElementById('pet-container').classList.add('hidden');
                showScreen('select');

                alert(`Your ${currentPet.name} got bored and left! You got a new egg. Try again!`);
            }, 2000);
        }
    }
</script>


</body>
</html>
