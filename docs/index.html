<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eloise’s Mini Game Arcade</title>
    <style>
        :root{
            --bg: #2c3e50;
            --panel: #34495e;
            --text: #ecf0f1;
            --accent: #f1c40f;
            --accent2: #2ecc71;
            --danger: #e74c3c;
            --shadow: rgba(0,0,0,0.5);
            --muted: rgba(236,240,241,0.75);
            --dark: #222;
            --wood: #5d4037;
            --sky: #87CEEB;
        }

        * { box-sizing: border-box; }

        body{
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header / Footer */
        header, footer{
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 16px;
        }

        .header-inner, .footer-inner{
            width: 100%;
            max-width: 780px;
            background: var(--panel);
            border: 4px solid var(--accent);
            border-radius: 10px;
            padding: 12px 16px;
            box-shadow: 0 10px 20px var(--shadow);
        }

        .header-top{
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .title{
            font-size: 18px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title .badge{
            border: 2px solid var(--accent);
            border-radius: 999px;
            padding: 2px 10px;
            font-size: 12px;
            color: var(--accent);
            background: rgba(0,0,0,0.15);
        }

        .sub{
            margin-top: 6px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.4;
        }

        .header-controls{
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="search"]{
            appearance: none;
            border: 2px solid rgba(241,196,15,0.65);
            background: rgba(0,0,0,0.18);
            color: var(--text);
            border-radius: 8px;
            padding: 10px 12px;
            font-family: inherit;
            outline: none;
            width: min(320px, 72vw);
        }
        input[type="search"]::placeholder{ color: rgba(236,240,241,0.6); }

        button.small{
            border: none;
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            font-family: inherit;
            background: var(--accent2);
            color: #0b2b18;
            font-weight: 700;
            transition: transform 0.1s;
            user-select: none;
        }
        button.small:active{ transform: scale(0.97); }

        /* Main panel */
        main{
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 0 16px 24px;
        }

        #menu-container{
            width: 100%;
            max-width: 780px;
            background: var(--panel);
            border: 4px solid var(--accent);
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 10px 20px var(--shadow);
        }

        /* Window vibe banner */
        .window-frame{
            border: 8px solid var(--wood);
            background-color: var(--sky);
            height: 130px;
            border-radius: 6px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .sun{
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 28px;
        }
        .town{
            font-size: 38px;
            line-height: 38px;
            white-space: nowrap;
            filter: drop-shadow(1px 1px 0px #000);
            padding-bottom: 8px;
        }

        /* Grid of games */
        .grid{
            display: grid;
            grid-template-columns: repeat( auto-fit, minmax(240px, 1fr) );
            gap: 12px;
            margin-top: 12px;
        }

        .card{
            border: 3px solid rgba(241,196,15,0.8);
            border-radius: 10px;
            background: rgba(0,0,0,0.15);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 170px;
        }

        .card-top{
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .card h2{
            margin: 0;
            font-size: 16px;
            letter-spacing: 0.3px;
            line-height: 1.2;
        }

        .pill{
            border: 2px solid rgba(236,240,241,0.35);
            color: rgba(236,240,241,0.85);
            border-radius: 999px;
            padding: 2px 10px;
            font-size: 12px;
            white-space: nowrap;
            background: rgba(0,0,0,0.12);
        }

        .desc{
            margin: 0;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.35;
            min-height: 38px;
        }

        .card-actions{
            margin-top: auto;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        a.btn{
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 8px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.1s;
            user-select: none;
        }
        a.btn:active{ transform: scale(0.97); }

        .play{
            background: var(--accent2);
            color: #0b2b18;
            flex: 1;
            min-width: 120px;
            text-align: center;
        }

        .code{
            background: rgba(0,0,0,0.2);
            color: var(--text);
            border: 2px solid rgba(241,196,15,0.45);
            flex: 0;
            white-space: nowrap;
        }

        .empty{
            border: 3px dashed rgba(241,196,15,0.6);
            border-radius: 10px;
            padding: 16px;
            color: rgba(236,240,241,0.8);
            text-align: center;
            background: rgba(0,0,0,0.12);
        }

        /* Footer */
        .footer-inner{
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            color: rgba(236,240,241,0.75);
            font-size: 12px;
        }

        .footer-links{
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .footer-links a{
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px dashed rgba(241,196,15,0.7);
        }
        .footer-links a:hover{
            border-bottom-style: solid;
        }

        /* Small helper text */
        .hint{
            margin-top: 10px;
            font-size: 12px;
            color: rgba(236,240,241,0.7);
            font-style: italic;
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="header-top">
            <div class="title">
                🕹️ Eloise’s Mini Game Arcade
                <span class="badge" id="count-badge">0 games</span>
            </div>

            <div class="header-controls">
                <input id="search" type="search" placeholder="Search games..." aria-label="Search games" />
                <button class="small" id="randomBtn" type="button">🎲 Random</button>
            </div>
        </div>

        <div class="sub" id="subtitle">
            Pick a door. Cause a little chaos. Add more games later by editing one array. ✨
        </div>
    </div>
</header>

<main>
    <div id="menu-container">
        <div class="window-frame" aria-hidden="true">
            <div class="sun">☀️</div>
            <div class="town" id="town">🏠🏰🏠🌲🏘️</div>
        </div>

        <div class="grid" id="grid"></div>

<!--        <div class="hint">-->
<!--            Tip: each game is one object in <code>GAMES</code>. Path should be relative to <code>/docs/</code>.-->
<!--        </div>-->
    </div>
</main>

<footer>
    <div class="footer-inner">
        <div>
            © <span id="year"></span> Eloise • Built in pure HTML/CSS/JS • Product design & art human made. Code LLM generated.
        </div>
        <div class="footer-links" id="footerLinks">
            <!-- Optional global links set in CONFIG below -->
        </div>
    </div>
</footer>

<script>
    /***********************
     * CONFIG (edit this)
     ***********************/
    const CONFIG = {
        siteTitle: "Eloise’s Mini Game Arcade",
        // Optional global links in footer (can be empty)
        footerLinks: [
            // { label: "GitHub", href: "https://github.com/yourname/yourrepo" },
            // { label: "About", href: "./about.html" },
        ],
        // Town banner emoji string (pure vibe control)
        townBanner: "🏠🏰🏠🌲🏘️",
    };

    // Add games here. That’s it.
    const GAMES = [
        {
            id: "yes_no",
            title: "The Yes or No Kingdom",
            description: "Rule by vibes. Choose YES or NO. Hope the kingdom survives.",
            path: "./yes_no/index.html",
            // Optional:
            // github: "https://github.com/yourname/yourrepo/tree/main/docs/yes_no"
            tag: "choices",
            emoji: "👑",
        },
        {
            id: "swimming",
            title: "Swimming",
            description: "Swim fast, but don't give yourself an repetitive strain injury.",
            path: "./swimming/index.html",
            // Optional:
            github: "https://github.com/matthewdeanmartin/swimming_game",
            tag: "arcade",
            emoji: "🏊",
        },
        {
            id: "pet",
            title: "Pets",
            description: "Take care of your pet!",
            path: "./pet/index.html",
            github: "https://github.com/matthewdeanmartin/mini_games/pet",
            tag: "animals",
            emoji: "🐈",
        },
        {
            id: "falling_food",
            title: "Falling Food",
            description: "Catch that food!",
            path: "./falling_food/index.html",
            // Optional:
            github: "https://github.com/matthewdeanmartin/falling_food",
            tag: "food",
            emoji: "🫔",
        },


        {
            id: "school_game",
            title: "Late Again!",
            description: "Ferdinann is late for school. Escape the principal's office!",
            path: "./school_game/index.html",
            github: "https://github.com/matthewdeanmartin/mini_games/tree/main/school_game",
            tag: "adventure",
            emoji: "🏫",
        },

        // Example of adding a new one:
        // {
        //   id: "new_game",
        //   title: "My New Game",
        //   description: "One sentence pitch.",
        //   path: "./new_game/index.html",
        //   github: "https://github.com/you/repo/tree/main/docs/new_game",
        //   tag: "prototype",
        //   emoji: "✨",
        // },
    ];

    /***********************
     * RENDERING
     ***********************/
    const grid = document.getElementById("grid");
    const search = document.getElementById("search");
    const randomBtn = document.getElementById("randomBtn");
    const badge = document.getElementById("count-badge");

    // Header bits
    document.title = CONFIG.siteTitle;
    document.querySelector(".title").childNodes[2].textContent = " " + CONFIG.siteTitle + " ";
    document.getElementById("town").textContent = CONFIG.townBanner;
    document.getElementById("year").textContent = new Date().getFullYear();

    // Footer links (optional)
    const footerLinks = document.getElementById("footerLinks");
    CONFIG.footerLinks.forEach(l => {
        const a = document.createElement("a");
        a.href = l.href;
        a.textContent = l.label;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        footerLinks.appendChild(a);
    });

    function normalize(str){
        return (str || "").toLowerCase().trim();
    }

    function matches(game, q){
        if(!q) return true;
        const hay = normalize(
            `${game.id} ${game.title} ${game.description} ${game.tag || ""} ${game.emoji || ""}`
        );
        return hay.includes(q);
    }

    function render(list){
        grid.innerHTML = "";

        badge.textContent = `${list.length} game${list.length === 1 ? "" : "s"}`;

        if(list.length === 0){
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.innerHTML = `
          <div style="font-size:18px; margin-bottom:6px;">No matches 😵‍💫</div>
          <div style="font-size:13px; opacity:0.9;">
            Try a different search… or add a new game in the <code>GAMES</code> array.
          </div>
        `;
            grid.appendChild(empty);
            return;
        }

        list.forEach(game => {
            const card = document.createElement("div");
            card.className = "card";

            const tagText = game.tag ? game.tag : "mini game";
            const emoji = game.emoji ? game.emoji : "🎮";

            card.innerHTML = `
          <div class="card-top">
            <div>
              <h2>${emoji} ${escapeHtml(game.title)}</h2>
            </div>
            <div class="pill">${escapeHtml(tagText)}</div>
          </div>

          <p class="desc">${escapeHtml(game.description || "")}</p>

          <div class="card-actions">
            <a class="btn play" href="${game.path}">▶ Play</a>
            ${game.github ? `<a class="btn code" href="${game.github}" target="_blank" rel="noopener noreferrer">Source Code</a>` : ``}
          </div>
        `;

            grid.appendChild(card);
        });
    }

    function escapeHtml(str){
        return String(str)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function currentFiltered(){
        const q = normalize(search.value);
        return GAMES.filter(g => matches(g, q));
    }

    search.addEventListener("input", () => render(currentFiltered()));

    randomBtn.addEventListener("click", () => {
        const list = currentFiltered();
        if(list.length === 0) return;
        const pick = list[Math.floor(Math.random() * list.length)];
        window.location.href = pick.path;
    });

    // Initial render
    render(GAMES);
</script>
</body>
</html>
