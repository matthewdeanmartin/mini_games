# Builds the TypeScript games and deploys the whole docs/ site to GitHub Pages.
#
# NOTE: for this workflow to deploy, change the repo setting
# Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
# Until then, Pages keeps serving straight from docs/ (built output is
# committed there too, so both modes work).
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: school_game/package-lock.json
      - name: Build school_game
        run: |
          npm ci --prefix school_game
          npm run build --prefix school_game
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
